name: Deploy Static Site to GitHub Pages

on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: ["changes"]

  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we are just hosting a static site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull the code from your repository onto the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup GitHub Pages settings automatically
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 3: Upload the files (index.html and assets) as an artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # "." means upload everything in the root directory
          path: "."

      # Step 4: Deploy the uploaded files to GitHub Pages live
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4